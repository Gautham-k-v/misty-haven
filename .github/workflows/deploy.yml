name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Confirm the build is not blank
        run: |
          test -s dist/index.html
          grep -q 'id="root"' dist/index.html
          grep -q 'Misty Haven' dist/index.html
          js=$(find dist/assets -name 'index-*.js' -size +10k | head -1)
          css=$(find dist/assets -name 'index-*.css' -size +1k | head -1)
          test -n "$js"
          test -n "$css"
          grep -q 'assets/index-' dist/index.html
          grep -q '\./' dist/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
